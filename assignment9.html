<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 500px;
            width: 800px;
            background-color: darkblue;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            background-color: skyblue;
        }
        .box1{
            height: 60%;
            padding: 55px 20px 20px 80px;
            width: 65%;
            background-color: blue;
            border: 20px solid navy;
            margin: 20px 20px 20px 40px;
        }
        .box2{
            height: 80%;
            width: 80%;
            background-color: orange;
        }
    </style>
</head>
<body>
    <h1 align="center">Box plotting</h1>
    <div class="con">
        <div class="box">
            
            <div class="box1">
                <div class="box2"></div>
            </div>
        </div>
        
    </div>
</body>
</html>
